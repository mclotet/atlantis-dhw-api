services:

  dhw-api:
    # DHW (Domestic Hot Water) status REST API backed by InfluxDB
    build: .
    container_name: dhw-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Secret supplied at runtime — not in atlantis.toml
      DHW_INFLUXDB_TOKEN: ${DHW_INFLUXDB_TOKEN}
      ATLANTIS_EDGE_NODE_ID: ${ATL_DHW_EDGE_NODE_ID}
      LOG_FORMAT: json
    healthcheck:
      # python:3.12-slim has no curl, so probe with urllib
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); sys.exit(0 if r.status==200 else 1)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
