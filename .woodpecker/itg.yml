# =============================================================================
# Woodpecker CI — atlantis-dhw-api (the service's OWN repo) — ITG instance
#
# CI ONLY: build + test the service where its code lives. Deployment into the
# live stack is handled separately by atlantis-controller's pipeline (CD), since
# that needs the stack compose file + submodule pointer. This file is selected
# by the ITG Woodpecker instance via Project Settings -> pipeline path.
# (.woodpecker/pro.yml is the identical PRO counterpart; CI is env-agnostic, the
# split is kept only for model uniformity across all repos.)
#
# Triggers: push (CI feedback where the code lives) + cron + manual.
# =============================================================================

when:
  - event: [push, cron, manual]

# Override the implicit clone so submodules (libs/atlantis-core, a PRIVATE repo)
# are fetched WITH the Woodpecker-provided netrc credentials. A manual
# `git submodule update` in a normal step has no creds and fails with
# "could not read Username for https://github.com". .gitmodules already uses
# https URLs, so the clone plugin reuses the token.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  # Unit tests. dhw-api imports atlantis_core from the libs/atlantis-core
  # submodule (NOT a pyproject dependency) — install it first (mirroring the
  # Dockerfile), then dhw-api with its dev/test extras. Submodule is already
  # present from the recursive clone above.
  test:
    image: python:3.12-slim
    commands:
      - pip install --quiet --no-cache-dir ./libs/atlantis-core/python[config]
      - pip install --quiet --no-cache-dir .[dev]
      - pytest -q

  # Confirm the production image still builds (catches Dockerfile/dep breakage).
  # The Dockerfile COPYs libs/atlantis-core/python (present from recursive clone).
  build:
    image: docker:27-cli
    commands:
      - docker build -t atlantis-dhw-api:ci .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
